name: Rebuild bomgrowth.com

# bomgrowth.com/free-gtm-skills is generated from this repo at build time. When skills, playbooks
# or the README change on main, ping the site's Netlify build hook so the pages update.
# Setup: in Netlify, add a build hook for the site's main branch, then save the URL as the
# repository secret NETLIFY_BUILD_HOOK.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'playbooks/**'
      - 'marketing-brain-template/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Netlify build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK is not set; skipping. See the comment at the top of this file."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' \
            "$HOOK?trigger_title=b2b-gtm-skills%20${GITHUB_SHA::7}"
